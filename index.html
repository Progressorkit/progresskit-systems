<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="ProgressorKit Systems — software engineering, product systems, integracje i automatyzacja procesów."
  />
  <title>ProgressorKit Systems | Software Engineering</title>
  <link rel="icon" href="assets/brand/progressorkit-symbol.svg" type="image/svg+xml" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: dark;
      --surface-0: #06080b;
      --surface-1: #0b0f14;
      --surface-2: #11171e;
      --surface-3: #171f28;
      --panel: rgba(14, 19, 25, 0.96);
      --panel-raised: rgba(20, 27, 35, 0.98);
      --line: rgba(146, 181, 211, 0.16);
      --line-strong: rgba(77, 181, 255, 0.42);
      --system-blue: #45b8ff;
      --system-blue-soft: #92d8ff;
      --copper: #c98752;
      --signal: #d85d5d;
      --text: #edf4f8;
      --text-muted: #9ca9b5;
      --text-dim: #6f7c87;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
      --radius: 10px;
      --brand-symbol: url("assets/brand/progressorkit-symbol.svg");
      --brand-relief-mask: var(--brand-symbol);
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      background: var(--surface-0);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button,
    textarea {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    #background-surface,
    #atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #background-surface {
      z-index: 0;
      background:
        radial-gradient(circle at 16% 12%, rgba(35, 112, 163, 0.14), transparent 34%),
        radial-gradient(circle at 84% 86%, rgba(201, 135, 82, 0.07), transparent 30%),
        linear-gradient(145deg, #0b1016 0%, #06080b 48%, #0a0e13 100%);
    }

    #background-surface::after {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 64px 64px;
      content: "";
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.5), transparent 82%);
    }

    #atmosphere {
      z-index: 2;
      background:
        linear-gradient(180deg, rgba(3, 6, 9, 0.12), rgba(3, 6, 9, 0.42)),
        radial-gradient(ellipse at center, transparent 24%, rgba(2, 4, 7, 0.34) 100%);
    }

    #header-console,
    #panel,
    #statusbar {
      position: relative;
      min-width: 0;
    }

    #header-console {
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      padding: 16px clamp(20px, 4vw, 64px);
      border-bottom: 1px solid var(--line);
      background: rgba(7, 10, 14, 0.97);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.24);
    }

    .brand-lockup {
      display: flex;
      min-width: max-content;
      align-items: center;
      gap: 13px;
    }

    .brand-symbol {
      display: block;
      width: 38px;
      flex: 0 0 38px;
      aspect-ratio: 1;
      background: linear-gradient(145deg, #d8e3e9 0%, #7e9caf 48%, var(--system-blue) 100%);
      filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.08));
      -webkit-mask: var(--brand-symbol) center / contain no-repeat;
      mask: var(--brand-symbol) center / contain no-repeat;
      opacity: 0.92;
    }

    .brand-lockup h1 {
      font-size: clamp(17px, 2vw, 23px);
      font-weight: 750;
      letter-spacing: 0.14em;
      line-height: 1.15;
    }

    .brand-lockup p {
      margin-top: 6px;
      color: var(--system-blue-soft);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
    }

    .nav-horizontal {
      display: flex;
      min-width: 0;
      max-width: 100%;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }

    .nav-item {
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 10px 13px;
      background: transparent;
      color: #aebac5;
      cursor: pointer;
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      white-space: nowrap;
      transition:
        color 160ms ease,
        border-color 160ms ease,
        background 160ms ease;
    }

    .nav-item:hover {
      border-color: rgba(69, 184, 255, 0.26);
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(111, 201, 255, 0.07), transparent),
        rgba(9, 16, 22, 0.52);
    }

    .nav-item.active {
      border-color: var(--line-strong);
      color: var(--system-blue-soft);
      background:
        linear-gradient(180deg, rgba(117, 207, 255, 0.12), rgba(69, 184, 255, 0.035)),
        rgba(10, 19, 27, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow:
        inset 0 1px 0 rgba(220, 244, 255, 0.09),
        0 5px 16px rgba(0, 105, 168, 0.08);
    }

    :where(button, a, textarea):focus-visible {
      outline: 2px solid var(--system-blue);
      outline-offset: 3px;
    }

    #panel {
      z-index: 20;
      width: min(100%, 1280px);
      min-height: 0;
      margin: 0 auto;
      overflow-y: auto;
      padding: clamp(24px, 4vw, 52px) clamp(18px, 4vw, 48px) 72px;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    #panel::-webkit-scrollbar {
      display: none;
    }

    #p-content {
      width: 100%;
      min-width: 0;
      max-width: 1160px;
      margin: 0 auto;
    }

    .module-section {
      animation: moduleEnter 420ms cubic-bezier(0.2, 0.75, 0.2, 1) both;
    }

    .module-section:not(.panel-card) {
      padding-top: clamp(8px, 1.5vh, 18px);
    }

    @keyframes moduleEnter {
      from {
        transform: translateY(12px);
      }

      to {
        transform: translateY(0);
      }
    }

    .panel-card,
    .tile {
      position: relative;
      max-width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.025), transparent 34%),
        var(--panel);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      box-shadow:
        var(--shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);
    }

    .panel-card::before,
    .tile::before {
      position: absolute;
      top: 0;
      left: 0;
      width: 84px;
      height: 1px;
      background: linear-gradient(90deg, var(--system-blue), transparent);
      content: "";
    }

    .hero-card {
      display: flex;
      min-height: clamp(390px, 62vh, 620px);
      align-items: center;
      padding: clamp(34px, 7vw, 84px);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 790px;
    }

    #brand-relief {
      --pointer-x: 50%;
      --pointer-y: 50%;
      --relief-x: 0px;
      --relief-y: 0px;
      --relief-rotate: 0deg;
      position: absolute;
      z-index: 1;
      top: 50%;
      right: clamp(-118px, -7vw, -58px);
      width: clamp(390px, 43vw, 540px);
      aspect-ratio: 1;
      contain: layout paint style;
      isolation: isolate;
      pointer-events: auto;
      transform: translateY(-50%);
    }

    .brand-relief__motion,
    .brand-relief__layer {
      position: absolute;
      inset: 7%;
    }

    .brand-relief__motion {
      transform: translate3d(var(--relief-x), var(--relief-y), 0) rotate(var(--relief-rotate));
      transform-origin: center;
      transition: transform 560ms cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    #brand-relief.is-active .brand-relief__motion {
      will-change: transform;
      transition-duration: 110ms;
    }

    .brand-relief__layer {
      inset: 0;
      -webkit-mask-image: var(--brand-relief-mask);
      mask-image: var(--brand-relief-mask);
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: contain;
      mask-size: contain;
    }

    .brand-relief__shadow {
      background: rgba(0, 0, 0, 0.86);
      filter: blur(0.45px) drop-shadow(8px 11px 15px rgba(0, 0, 0, 0.34));
      opacity: 0.82;
      transform: translate3d(3px, 4px, 0);
    }

    .brand-relief__edge {
      background: linear-gradient(142deg, rgba(178, 204, 219, 0.42), rgba(63, 82, 94, 0.1) 45%, rgba(0, 0, 0, 0.5) 78%);
      filter: blur(0.15px);
      opacity: 0.42;
      transform: translate3d(-1.5px, -1.5px, 0);
    }

    .brand-relief__face {
      background:
        radial-gradient(circle at 34% 28%, rgba(116, 139, 152, 0.18), transparent 33%),
        linear-gradient(142deg, #283139 0%, #192127 38%, #10161b 66%, #090d10 100%);
      filter:
        drop-shadow(-1px -1px 0 rgba(164, 195, 211, 0.1))
        drop-shadow(1.5px 2px 0 rgba(0, 0, 0, 0.78));
    }

    .brand-relief__texture {
      background:
        repeating-linear-gradient(116deg, rgba(223, 237, 244, 0.052) 0 0.55px, transparent 0.7px 2.7px),
        repeating-linear-gradient(24deg, rgba(0, 0, 0, 0.12) 0 0.65px, transparent 0.8px 3.4px),
        linear-gradient(132deg, rgba(198, 216, 225, 0.05), rgba(0, 0, 0, 0.15));
      mix-blend-mode: soft-light;
      opacity: 0.36;
      transition: opacity 260ms ease;
    }

    .brand-relief__light {
      background: radial-gradient(
        circle at var(--pointer-x) var(--pointer-y),
        rgba(69, 184, 255, 0.34) 0%,
        rgba(69, 184, 255, 0.13) 18%,
        transparent 46%
      );
      mix-blend-mode: screen;
      opacity: 0.08;
      transition: opacity 420ms ease;
    }

    #brand-relief.is-active .brand-relief__texture {
      opacity: 0.54;
    }

    #brand-relief.is-active .brand-relief__light {
      opacity: 0.52;
      transition-duration: 180ms;
    }

    .brand-relief__sheen {
      background-image: linear-gradient(
        112deg,
        transparent 36%,
        rgba(198, 225, 238, 0.02) 43%,
        rgba(230, 245, 251, 0.38) 48%,
        rgba(201, 135, 82, 0.2) 50%,
        rgba(134, 204, 237, 0.12) 53%,
        transparent 59%
      );
      background-position: 150% 0;
      background-size: 260% 100%;
      mix-blend-mode: screen;
      opacity: 0;
    }

    #brand-relief.is-sheening .brand-relief__sheen {
      animation: reliefSheen 720ms cubic-bezier(0.2, 0.66, 0.22, 1) both;
    }

    @keyframes reliefSheen {
      0% {
        background-position: 150% 0;
        opacity: 0;
      }

      18% {
        opacity: 0.48;
      }

      72% {
        opacity: 0.22;
      }

      100% {
        background-position: -70% 0;
        opacity: 0;
      }
    }

    .eyebrow,
    .tile-header,
    .section-kicker {
      color: var(--system-blue-soft);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .eyebrow,
    .section-kicker {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .eyebrow::before,
    .section-kicker::before {
      width: 24px;
      height: 1px;
      background: var(--copper);
      content: "";
    }

    .hero-card h2 {
      max-width: 780px;
      margin-top: 24px;
      font-size: clamp(34px, 6.4vw, 74px);
      font-weight: 760;
      letter-spacing: -0.045em;
      line-height: 0.98;
    }

    .hero-card h2 span {
      display: block;
      color: var(--system-blue-soft);
    }

    .hero-card p {
      max-width: 720px;
      margin-top: 28px;
      color: var(--text-muted);
      font-size: clamp(15px, 1.8vw, 18px);
      line-height: 1.75;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    .cta-button {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(137, 218, 255, 0.76);
      border-radius: 8px;
      padding: 12px 18px;
      background:
        linear-gradient(
          180deg,
          rgba(179, 230, 255, 0.24) 0%,
          rgba(69, 184, 255, 0.13) 48%,
          rgba(5, 76, 119, 0.14) 100%
        ),
        rgba(19, 133, 199, 0.8);
      backdrop-filter: blur(9px) saturate(128%);
      -webkit-backdrop-filter: blur(9px) saturate(128%);
      box-shadow:
        inset 0 1px 0 rgba(235, 249, 255, 0.25),
        inset 0 -1px 0 rgba(3, 53, 83, 0.32),
        0 8px 24px rgba(0, 127, 200, 0.15),
        0 0 0 1px rgba(69, 184, 255, 0.06);
      color: #f5fbff;
      cursor: pointer;
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-decoration: none;
      transition:
        transform 160ms ease,
        border-color 160ms ease,
        box-shadow 180ms ease,
        filter 180ms ease,
        color 160ms ease;
    }

    .cta-button::before {
      position: absolute;
      top: -40%;
      left: -46%;
      width: 34%;
      height: 180%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(231, 248, 255, 0.22),
        transparent
      );
      content: "";
      pointer-events: none;
      transform: translateX(-180%) skewX(-18deg);
      transition: transform 720ms cubic-bezier(0.2, 0.72, 0.2, 1);
    }

    .cta-button:is(:hover, :focus-visible) {
      transform: translateY(-2px);
      border-color: rgba(186, 232, 255, 0.94);
      box-shadow:
        inset 0 1px 0 rgba(246, 252, 255, 0.34),
        inset 0 -1px 0 rgba(3, 53, 83, 0.28),
        0 11px 30px rgba(0, 139, 216, 0.22),
        0 0 18px rgba(69, 184, 255, 0.1);
      filter: brightness(1.06);
    }

    .cta-button:is(:hover, :focus-visible)::before {
      transform: translateX(470%) skewX(-18deg);
    }

    .cta-button.secondary {
      border-color: rgba(69, 184, 255, 0.48);
      background:
        linear-gradient(180deg, rgba(111, 201, 255, 0.09), rgba(17, 25, 34, 0.035)),
        rgba(7, 13, 19, 0.7);
      box-shadow:
        inset 0 1px 0 rgba(213, 242, 255, 0.09),
        inset 0 -1px 0 rgba(0, 0, 0, 0.22),
        0 7px 20px rgba(0, 0, 0, 0.2);
      color: #dceaf2;
    }

    .cta-button.secondary:is(:hover, :focus-visible) {
      border-color: rgba(119, 210, 255, 0.78);
      background:
        linear-gradient(180deg, rgba(111, 201, 255, 0.14), rgba(17, 25, 34, 0.055)),
        rgba(8, 16, 23, 0.78);
      box-shadow:
        inset 0 1px 0 rgba(225, 246, 255, 0.14),
        0 10px 27px rgba(0, 119, 186, 0.13),
        0 0 16px rgba(69, 184, 255, 0.07);
      color: var(--text);
    }

    .cta-button:focus-visible {
      outline: 2px solid var(--system-blue-soft);
      outline-offset: 4px;
    }

    .cta-button:active {
      transform: translateY(0) scale(0.99);
      border-color: rgba(117, 207, 255, 0.72);
      box-shadow:
        inset 0 1px 4px rgba(0, 36, 58, 0.34),
        0 3px 10px rgba(0, 105, 163, 0.12);
      filter: brightness(0.98);
      transition-duration: 70ms;
    }

    .section-intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .section-intro h2 {
      margin-top: 10px;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: -0.03em;
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .tile {
      padding: clamp(22px, 3vw, 32px);
    }

    .tile-header {
      margin-bottom: 18px;
    }

    .tile h2,
    .tile h3 {
      color: var(--text);
      font-size: clamp(20px, 2.7vw, 28px);
      letter-spacing: -0.02em;
      line-height: 1.16;
    }

    .tile p {
      margin-top: 14px;
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .signal-list {
      display: grid;
      gap: 16px;
      list-style: none;
    }

    .signal-list li {
      position: relative;
      padding-left: 20px;
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .signal-list li::before {
      position: absolute;
      top: 0.7em;
      left: 0;
      width: 7px;
      height: 1px;
      background: var(--copper);
      content: "";
    }

    .area-grid,
    .process-grid {
      display: grid;
      gap: 18px;
    }

    .area-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .process-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .area-card,
    .process-card {
      min-height: 220px;
    }

    .process-card .step-index {
      display: block;
      margin-bottom: 28px;
      color: var(--copper);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 13px;
      letter-spacing: 0.1em;
    }

    .work-section .section-intro {
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }

    .selected-work-grid {
      align-items: start;
    }

    .featured-projects:empty {
      display: none;
    }

    .featured-project {
      grid-column: 1 / -1;
      margin-bottom: 22px;
    }

    .project-card {
      align-self: start;
      padding: 14px;
    }

    .project-card .project-copy {
      padding: 12px 10px 14px;
    }

    .project-gallery {
      position: relative;
      width: 100%;
      height: 220px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #05070a;
    }

    .project-gallery img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 700ms ease-in-out;
    }

    .project-gallery img.active {
      opacity: 1;
    }

    .project-gallery.portrait-gallery {
      height: 320px;
    }

    .project-gallery.portrait-gallery img {
      object-fit: contain;
    }

    .stat-box {
      margin-top: 18px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
      color: var(--text-dim);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .stat-num {
      color: var(--system-blue-soft);
      font-weight: 800;
    }

    .contact-card {
      display: grid;
      min-height: min(520px, 62vh);
      place-items: center;
      padding: clamp(34px, 7vw, 76px);
      text-align: center;
    }

    .contact-content {
      max-width: 760px;
    }

    .contact-card h2 {
      margin-top: 20px;
      font-size: clamp(34px, 5.4vw, 62px);
      letter-spacing: -0.04em;
      line-height: 1.02;
    }

    .contact-card p {
      margin-top: 24px;
      color: var(--text-muted);
      font-size: 17px;
      line-height: 1.75;
    }

    .contact-email {
      display: inline-block;
      margin-top: 20px;
      color: var(--system-blue-soft);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 14px;
      text-decoration: none;
    }

    .contact-card .actions {
      justify-content: center;
    }

    .brief-card {
      padding: clamp(24px, 5vw, 54px);
    }

    .brief-card > h2 {
      margin-top: 12px;
      font-size: clamp(30px, 4.5vw, 48px);
      letter-spacing: -0.03em;
    }

    .brief-intro {
      max-width: 760px;
      margin-top: 16px;
      color: var(--text-muted);
      line-height: 1.7;
    }

    .brief-section {
      margin-top: 34px;
      border-top: 1px solid var(--line);
      padding-top: 26px;
    }

    .brief-section h3 {
      color: var(--system-blue-soft);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 13px;
      letter-spacing: 0.12em;
    }

    .brief-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .brief-item label {
      display: block;
      min-height: 44px;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .brief-item textarea {
      width: 100%;
      min-height: 108px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px;
      background: rgba(4, 7, 10, 0.7);
      color: var(--text);
      line-height: 1.55;

    const sliderIntervals = new Set();
    const reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    const navigationModule = {
      BRIEF: "KONTAKT"
    };
    let teardownBrandRelief = () => {};

    function stopSliders() {
      sliderIntervals.forEach((intervalId) => window.clearInterval(intervalId));
      sliderIntervals.clear();
    }

    function startSliders() {
      stopSliders();

      if (reducedMotionQuery.matches) {
        return;
      }

      document.querySelectorAll(".project-gallery").forEach((gallery) => {
        const images = Array.from(gallery.querySelectorAll("img"));
        let current = 0;

        if (images.length < 2) {
          return;
        }

        const intervalId = window.setInterval(() => {
          images[current].classList.remove("active");
          current = (current + 1) % images.length;
          images[current].classList.add("active");
        }, 3000);

        sliderIntervals.add(intervalId);
      });
    }

    function updateActiveNavigation(key) {
      const activeModule = navigationModule[key] || key;

      document.querySelectorAll(".nav-item").forEach((item) => {
        const isActive = item.dataset.module === activeModule;
        item.classList.toggle("active", isActive);
        item.setAttribute("aria-pressed", String(isActive));

        if (isActive) {
          item.setAttribute("aria-current", "page");
        } else {
          item.removeAttribute("aria-current");
        }
      });
    }

    function setupBrandRelief() {
      teardownBrandRelief();

      const relief = document.getElementById("brand-relief");
      if (!relief) {
        teardownBrandRelief = () => {};
        return;
      }

      let pointerFrame = null;
      let latestPointer = null;
      let sheenRunning = false;
      let sheenTimer = null;

      const onMotionPreferenceChange = () => setupBrandRelief();
      reducedMotionQuery.addEventListener("change", onMotionPreferenceChange);

      if (reducedMotionQuery.matches) {
        teardownBrandRelief = () => {
          reducedMotionQuery.removeEventListener("change", onMotionPreferenceChange);
        };
        return;
      }

      function renderPointer() {
        pointerFrame = null;

        if (!latestPointer) {
          return;
        }

        const bounds = relief.getBoundingClientRect();
        const x = Math.min(1, Math.max(0, (latestPointer.clientX - bounds.left) / bounds.width));
        const y = Math.min(1, Math.max(0, (latestPointer.clientY - bounds.top) / bounds.height));
        const horizontal = (x - 0.5) * 2;
        const vertical = (y - 0.5) * 2;

        relief.style.setProperty("--pointer-x", `${(x * 100).toFixed(2)}%`);
        relief.style.setProperty("--pointer-y", `${(y * 100).toFixed(2)}%`);
        relief.style.setProperty("--relief-x", `${(horizontal * 5).toFixed(2)}px`);
        relief.style.setProperty("--relief-y", `${(vertical * 4.5).toFixed(2)}px`);
        relief.style.setProperty("--relief-rotate", `${(horizontal * 1.2).toFixed(2)}deg`);
      }

      function queuePointer(event) {
        latestPointer = event;

        if (pointerFrame === null) {
          pointerFrame = window.requestAnimationFrame(renderPointer);
        }
      }

      function startSheen() {
        if (sheenRunning) {
          return;
        }

        sheenRunning = true;
        relief.classList.add("is-sheening");
        sheenTimer = window.setTimeout(finishSheen, 760);
      }

      function finishSheen() {
        if (sheenTimer !== null) {
          window.clearTimeout(sheenTimer);
          sheenTimer = null;
        }

        relief.classList.remove("is-sheening");
        sheenRunning = false;
      }

      function onPointerEnter(event) {
        relief.classList.add("is-active");
        queuePointer(event);
        startSheen();
      }

      function onPointerLeave() {
        latestPointer = null;

        if (pointerFrame !== null) {
          window.cancelAnimationFrame(pointerFrame);
          pointerFrame = null;
        }

        relief.classList.remove("is-active");
        relief.style.setProperty("--pointer-x", "50%");
        relief.style.setProperty("--pointer-y", "50%");
        relief.style.setProperty("--relief-x", "0px");
        relief.style.setProperty("--relief-y", "0px");
        relief.style.setProperty("--relief-rotate", "0deg");
        finishSheen();
      }

      function onAnimationEnd(event) {
        if (event.animationName !== "reliefSheen") {
          return;
        }

        finishSheen();
      }

      relief.addEventListener("pointerenter", onPointerEnter);
      relief.addEventListener("pointermove", queuePointer);
      relief.addEventListener("pointerleave", onPointerLeave);
      relief.addEventListener("animationend", onAnimationEnd);

      teardownBrandRelief = () => {
        if (pointerFrame !== null) {
          window.cancelAnimationFrame(pointerFrame);
        }

        if (sheenTimer !== null) {
          window.clearTimeout(sheenTimer);
        }

        relief.removeEventListener("pointerenter", onPointerEnter);
        relief.removeEventListener("pointermove", queuePointer);
        relief.removeEventListener("pointerleave", onPointerLeave);
        relief.removeEventListener("animationend", onAnimationEnd);
        reducedMotionQuery.removeEventListener("change", onMotionPreferenceChange);
      };
    }

    function loadModule(key) {
      if (!Object.prototype.hasOwnProperty.call(modules, key)) {
        return;
      }

      stopSliders();
      teardownBrandRelief();

      const content = document.getElementById("p-content");
      content.innerHTML = modules[key];
      updateActiveNavigation(key);

      if (key === "HERO") {
        setupBrandRelief();
      }

      if (key === "DOWODY") {
        startSliders();
      }

      document.getElementById("panel").scrollTop = 0;
    }

    document.addEventListener("click", (event) => {
      const moduleTrigger = event.target.closest("[data-module]");
      if (moduleTrigger) {
        loadModule(moduleTrigger.dataset.module);
        return;
      }

      const actionTrigger = event.target.closest("[data-action]");
      if (actionTrigger?.dataset.action === "print") {
        window.print();
      }
    });

    function updateClock() {
      document.getElementById("sys-time").textContent = new Date().toLocaleTimeString();
    }

    window.addEventListener("load", () => {
      loadModule("HERO");
      updateClock();
      window.setInterval(updateClock, 1000);
    });

    window.addEventListener("beforeunload", () => {
      stopSliders();
      teardownBrandRelief();
    });
  </script>
</body>
</html>
