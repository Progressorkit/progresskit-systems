<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="ProgressKit — software engineering, aplikacje, systemy SaaS i rozwiązania webowe."
  />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://progresskit.pl/" />
  <meta property="og:title" content="ProgressKit — Software Engineering &amp; Product Development" />
  <meta
    property="og:description"
    content="Backend, SaaS, aplikacje mobilne i kompletne systemy tworzone od architektury po wdrożenie."
  />
  <meta property="og:image" content="https://progresskit.pl/og-progresskit.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ProgressKit — Software Engineering &amp; Product Development" />
  <meta
    name="twitter:description"
    content="Backend, SaaS, aplikacje mobilne i kompletne systemy tworzone od architektury po wdrożenie."
  />
  <meta name="twitter:image" content="https://progresskit.pl/og-progresskit.jpg" />
  <title>ProgressKit Systems | Strony, aplikacje i systemy</title>
  <link rel="icon" href="assets/brand/progressorkit-primary.png" type="image/png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: dark;
      --surface-0: #050505;
      --surface-1: #0a0a0b;
      --surface-2: #101011;
      --surface-3: #151516;
      --panel: rgba(10, 10, 11, 0.96);
      --panel-raised: rgba(16, 16, 17, 0.98);
      --line: rgba(126, 131, 135, 0.2);
      --line-strong: rgba(227, 6, 19, 0.48);
      --system-blue: #e30613;
      --system-blue-soft: #ff1825;
      --copper: #e30613;
      --signal: #e30613;
      --signal-bright: #ff1825;
      --signal-dark: #8f0911;
      --action-blue: #2388ff;
      --action-blue-bright: #78bdff;
      --action-blue-deep: #082b62;
      --steel: #7e8387;
      --steel-dark: #34383c;
      --white-primary: #f4f4f2;
      --white-secondary: #d7d7d3;
      --text: #f4f4f2;
      --text-muted: #d7d7d3;
      --text-dim: #7e8387;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
      --radius: 10px;
      --brand-primary: url("assets/brand/progressorkit-primary.png");
      --brand-stamp: url("assets/brand/progressorkit-stamp.png");
      --brand-relief-mask: var(--brand-primary);
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      background: var(--surface-0);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button,
    textarea {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    #background-surface,
    #atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #background-surface {
      z-index: 0;
      background:
        radial-gradient(circle at 16% 12%, rgba(143, 9, 17, 0.1), transparent 34%),
        radial-gradient(circle at 84% 86%, rgba(201, 135, 82, 0.07), transparent 30%),
        linear-gradient(145deg, #0b1016 0%, #06080b 48%, #0a0e13 100%);
    }

    #background-surface::after {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 64px 64px;
      content: "";
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.5), transparent 82%);
    }

    #atmosphere {
      z-index: 2;
      background:
        linear-gradient(180deg, rgba(3, 6, 9, 0.12), rgba(3, 6, 9, 0.42)),
        radial-gradient(ellipse at center, transparent 24%, rgba(2, 4, 7, 0.34) 100%);
    }

    #header-console,
    #panel,
    #statusbar {
      position: relative;
      min-width: 0;
    }

    #header-console {
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      padding: 16px clamp(20px, 4vw, 64px);
      border-bottom: 1px solid var(--line);
      background: rgba(7, 10, 14, 0.97);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.24);
    }

    .brand-lockup {
      display: flex;
      min-width: max-content;
      align-items: center;
      gap: 13px;
    }

    .brand-symbol {
      display: block;
      width: 38px;
      flex: 0 0 38px;
      aspect-ratio: 1;
      background: var(--brand-primary) center / contain no-repeat;
    }

    .brand-lockup h1 {
      font-size: clamp(17px, 2vw, 23px);
      font-weight: 750;
      letter-spacing: 0.14em;
      line-height: 1.15;
    }

    .brand-lockup p {
      margin-top: 6px;
      color: var(--system-blue-soft);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
    }

    .nav-horizontal {
      display: flex;
      min-width: 0;
      max-width: 100%;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }

    .nav-item {
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 10px 13px;
      background: transparent;
      color: #7e8387;
      cursor: pointer;
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      white-space: nowrap;
      transition:
        color 160ms ease,
        border-color 160ms ease,
        background 160ms ease;
    }

    .nav-item:hover {
      border-color: rgba(227, 6, 19, 0.26);
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(244, 244, 242, 0.07), transparent),
        rgba(9, 16, 22, 0.52);
    }

    .nav-item.active {
      border-color: var(--line-strong);
      color: var(--system-blue-soft);
      background:
        linear-gradient(180deg, rgba(227, 6, 19, 0.12), rgba(227, 6, 19, 0.035)),
        rgba(10, 19, 27, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow:
        inset 0 1px 0 rgba(244, 244, 242, 0.09),
        0 5px 16px rgba(143, 9, 17, 0.08);
    }

    :where(button, a, textarea):focus-visible {
      outline: 2px solid var(--system-blue);
      outline-offset: 3px;
    }

    #panel {
      z-index: 20;
      width: min(100%, 1280px);
      min-height: 0;
      margin: 0 auto;
      overflow-y: auto;
      padding: clamp(24px, 4vw, 52px) clamp(18px, 4vw, 48px) 72px;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    #panel::-webkit-scrollbar {
      display: none;
    }

    #p-content {
      width: 100%;
      min-width: 0;
      max-width: 1160px;
      margin: 0 auto;
    }

    .module-section {
      position: relative;
      animation: moduleEnter 420ms cubic-bezier(0.2, 0.75, 0.2, 1) both;
    }

    .module-section:not(.panel-card) {
      padding-top: clamp(8px, 1.5vh, 18px);
    }

    @keyframes moduleEnter {
      from {
        transform: translateY(12px);
      }

      to {
        transform: translateY(0);
      }
    }

    .panel-card,
    .tile {
      position: relative;
      max-width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.025), transparent 34%),
        var(--panel);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      box-shadow:
        var(--shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);
    }

    .panel-card::before,
    .tile::before {
      position: absolute;
      top: 0;
      left: 0;
      width: 84px;
      height: 1px;
      background: linear-gradient(90deg, var(--system-blue), transparent);
      content: "";
    }

    .hero-card {
      display: flex;
      min-height: clamp(390px, 62vh, 620px);
      align-items: center;
      padding: clamp(34px, 7vw, 84px);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 790px;
    }

    #brand-relief {
      --pointer-x: 50%;
      --pointer-y: 50%;
      --relief-x: 0px;
      --relief-y: 0px;
      --relief-rotate: 0deg;
      position: absolute;
      z-index: 1;
      top: 50%;
      right: clamp(-118px, -7vw, -58px);
      width: clamp(390px, 43vw, 540px);
      aspect-ratio: 1;
      contain: layout paint style;
      isolation: isolate;
      pointer-events: auto;
      transform: translateY(-50%);
    }

    .brand-relief__motion {
      position: absolute;
      inset: 7%;
      transform: translate3d(var(--relief-x), var(--relief-y), 0) rotate(var(--relief-rotate));
      transform-origin: center;
      transition: transform 560ms cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    #brand-relief.is-active .brand-relief__motion {
      will-change: transform;
      transition-duration: 110ms;
    }

    .brand-relief__image,
    .brand-relief__layer {
      position: absolute;
      inset: 0;
    }

    .brand-relief__image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 13px 24px rgba(0, 0, 0, 0.3));
      opacity: 0.92;
      user-select: none;
      transition:
        opacity 260ms ease,
        filter 260ms ease;
      -webkit-user-drag: none;
    }

    #brand-relief.is-active .brand-relief__image {
      filter: drop-shadow(0 15px 28px rgba(0, 0, 0, 0.34));
      opacity: 1;
    }

    .brand-relief__layer {
      -webkit-mask-image: var(--brand-relief-mask);
      mask-image: var(--brand-relief-mask);
      mask-mode: alpha;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: contain;
      mask-size: contain;
    }

    .brand-relief__light {
      background: radial-gradient(
        circle at var(--pointer-x) var(--pointer-y),
        rgba(244, 244, 242, 0.25) 0%,
        rgba(227, 6, 19, 0.1) 18%,
        transparent 43%
      );
      mix-blend-mode: screen;
      opacity: 0.04;
      transition: opacity 420ms ease;
    }

    #brand-relief.is-active .brand-relief__light {
      opacity: 0.38;
      transition-duration: 180ms;
    }

    .brand-relief__sheen {
      background-image: linear-gradient(
        112deg,
        transparent 36%,
        rgba(215, 215, 211, 0.02) 43%,
        rgba(230, 245, 251, 0.28) 48%,
        rgba(201, 135, 82, 0.12) 50%,
        rgba(227, 6, 19, 0.08) 53%,
        transparent 59%
      );
      background-position: 150% 0;
      background-size: 260% 100%;
      mix-blend-mode: screen;
      opacity: 0;
    }

    #brand-relief.is-sheening .brand-relief__sheen {
      animation: reliefSheen 720ms cubic-bezier(0.2, 0.66, 0.22, 1) both;
    }

    @keyframes reliefSheen {
      0% {
        background-position: 150% 0;
        opacity: 0;
      }

      18% {
        opacity: 0.36;
      }

      72% {
        opacity: 0.16;
      }

      100% {
        background-position: -70% 0;
        opacity: 0;
      }
    }

    .stamped-section {
      isolation: isolate;
    }

    .stamped-section > :not(.system-stamp) {
      position: relative;
      z-index: 1;
    }

    .system-stamp {
      --stamp-size: 74px;
      position: absolute;
      z-index: 2;
      display: block;
      width: var(--stamp-size);
      aspect-ratio: 1;
      background: var(--brand-stamp) center / contain no-repeat;
      filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.22));
      opacity: 0.58;
      pointer-events: auto;
      transition:
        opacity 180ms ease,
        transform 180ms ease;
    }

    .system-stamp:hover {
      opacity: 0.7;
      transform: translate3d(0, -1px, 0);
    }

    .system-stamp--approach,
    .system-stamp--areas,
    .system-stamp--process {
      top: 2px;
      right: 4px;
    }

    .system-stamp--work {
      --stamp-size: 68px;
      top: 4px;
      right: 6px;
    }

    .system-stamp--contact {
      --stamp-size: 82px;
      right: 18px;
      bottom: 16px;
    }

    .system-stamp--brief {
      --stamp-size: 70px;
      top: 18px;
      right: 18px;
    }

    .eyebrow,
    .tile-header,
    .section-kicker {
      color: var(--system-blue-soft);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .eyebrow,
    .section-kicker {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .eyebrow::before,
    .section-kicker::before {
      width: 24px;
      height: 1px;
      background: var(--copper);
      content: "";
    }

    .hero-card h2 {
      max-width: 780px;
      margin-top: 24px;
      font-size: clamp(34px, 6.4vw, 74px);
      font-weight: 760;
      letter-spacing: -0.045em;
      line-height: 0.98;
    }

    .hero-card h2 span {
      display: block;
      color: var(--system-blue-soft);
    }

    .hero-card p {
      max-width: 720px;
      margin-top: 28px;
      color: var(--text-muted);
      font-size: clamp(15px, 1.8vw, 18px);
      line-height: 1.75;
    }

    .hero-capabilities {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 18px;
      color: var(--text-dim);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .hero-capabilities span + span::before {
      margin-inline: 10px;
      color: var(--copper);
      content: "//";
      opacity: 0.72;
    }

    .hero-capabilities + .actions {
      margin-top: 26px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    .cta-button {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(255, 24, 37, 0.76);
      border-radius: 8px;
      padding: 12px 18px;
      background:
        linear-gradient(
          180deg,
          rgba(244, 244, 242, 0.18) 0%,
          rgba(227, 6, 19, 0.13) 48%,
          rgba(143, 9, 17, 0.14) 100%
        ),
        rgba(227, 6, 19, 0.8);
      backdrop-filter: blur(9px) saturate(128%);
      -webkit-backdrop-filter: blur(9px) saturate(128%);
      box-shadow:
        inset 0 1px 0 rgba(235, 249, 255, 0.25),
        inset 0 -1px 0 rgba(80, 5, 10, 0.32),
        0 8px 24px rgba(227, 6, 19, 0.15),
        0 0 0 1px rgba(227, 6, 19, 0.06);
      color: #f5fbff;
      cursor: pointer;
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-decoration: none;
      transition:
        transform 160ms ease,
        border-color 160ms ease,
        box-shadow 180ms ease,
        filter 180ms ease,
        color 160ms ease;
    }

    .cta-button::before {
      position: absolute;
      top: -40%;
      left: -46%;
      width: 34%;
      height: 180%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(231, 248, 255, 0.22),
        transparent
      );
      content: "";
      pointer-events: none;
      transform: translateX(-180%) skewX(-18deg);
      transition: transform 720ms cubic-bezier(0.2, 0.72, 0.2, 1);
    }

    .cta-button:is(:hover, :focus-visible) {
      transform: translateY(-2px);
      border-color: rgba(255, 24, 37, 0.94);
      box-shadow:
        inset 0 1px 0 rgba(246, 252, 255, 0.34),
        inset 0 -1px 0 rgba(80, 5, 10, 0.28),
        0 11px 30px rgba(227, 6, 19, 0.22),
        0 0 18px rgba(227, 6, 19, 0.1);
      filter: brightness(1.06);
    }

    .cta-button:is(:hover, :focus-visible)::before {
      transform: translateX(470%) skewX(-18deg);
    }

    .cta-button.secondary {
      border-color: rgba(126, 131, 135, 0.48);
      background:
        linear-gradient(180deg, rgba(215, 215, 211, 0.09), rgba(16, 16, 17, 0.035)),
        rgba(7, 13, 19, 0.7);
      box-shadow:
        inset 0 1px 0 rgba(215, 215, 211, 0.09),
        inset 0 -1px 0 rgba(0, 0, 0, 0.22),
        0 7px 20px rgba(0, 0, 0, 0.2);
      color: #dceaf2;
    }

    .cta-button.secondary:is(:hover, :focus-visible) {
      border-color: rgba(255, 24, 37, 0.78);
      background:
        linear-gradient(180deg, rgba(227, 6, 19, 0.14), rgba(16, 16, 17, 0.055)),
        rgba(8, 16, 23, 0.78);
      box-shadow:
        inset 0 1px 0 rgba(244, 244, 242, 0.14),
        0 10px 27px rgba(227, 6, 19, 0.13),
        0 0 16px rgba(227, 6, 19, 0.07);
      color: var(--text);
    }

    .cta-button:focus-visible {
      outline: 2px solid var(--system-blue-soft);
      outline-offset: 4px;
    }

    .cta-button:active {
      transform: translateY(0) scale(0.99);
      border-color: rgba(255, 24, 37, 0.72);
      box-shadow:
        inset 0 1px 4px rgba(62, 4, 8, 0.34),
        0 3px 10px rgba(143, 9, 17, 0.12);
      filter: brightness(0.98);
      transition-duration: 70ms;
    }

    .section-intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .section-intro h2 {
      margin-top: 10px;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: -0.03em;
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .tile {
      padding: clamp(22px, 3vw, 32px);
    }

    .tile-header {
      margin-bottom: 18px;
    }

    .tile h2,
    .tile h3 {
      color: var(--text);
      font-size: clamp(20px, 2.7vw, 28px);
      letter-spacing: -0.02em;
      line-height: 1.16;
    }

    .tile p {
      margin-top: 14px;
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .signal-list {
      display: grid;
      gap: 16px;
      list-style: none;
    }

    .signal-list li {
      position: relative;
      padding-left: 20px;
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .signal-list li::before {
      position: absolute;
      top: 0.7em;
      left: 0;
      width: 7px;
      height: 1px;
      background: var(--copper);
      content: "";
    }

    .area-grid,
    .process-grid {
      display: grid;
      gap: 18px;
    }

    .area-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .process-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .area-card,
    .process-card {
      min-height: 220px;
    }

    .process-card .step-index {
      display: block;
      margin-bottom: 28px;
      color: var(--copper);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 13px;
      letter-spacing: 0.1em;
    }

    .work-section .section-intro {
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }

    .selected-work-grid {
      align-items: start;
    }

    .featured-projects {
      margin-top: 4px;
    }

    .featured-projects:empty {
      display: none;
    }

    .featured-intro .section-kicker {
      color: var(--system-blue-soft);
    }

    .selected-work-intro {
      margin-top: clamp(42px, 6vw, 72px);
    }

    .gotrans-featured {
      position: relative;
      padding: clamp(14px, 2.4vw, 26px);
      border-color: rgba(126, 131, 135, 0.4);
      background:
        linear-gradient(145deg, rgba(227, 6, 19, 0.05), transparent 34%),
        linear-gradient(325deg, rgba(201, 135, 82, 0.05), transparent 32%),
        var(--panel);
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.46),
        inset 0 1px 0 rgba(244, 244, 242, 0.08);
    }

    .gotrans-featured::before {
      position: absolute;
      inset: 0 auto auto 0;
      width: min(42%, 430px);
      height: 2px;
      background: linear-gradient(90deg, var(--system-blue), transparent);
      content: "";
    }

    .gotrans-masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.62fr);
      gap: 24px;
      align-items: end;
      padding: clamp(6px, 1vw, 12px) clamp(4px, 1vw, 10px) clamp(24px, 3vw, 34px);
    }

    .gotrans-gallery {
      display: grid;
      grid-template-columns: minmax(0, 1.56fr) minmax(260px, 0.74fr);
      gap: 10px;
    }

    .gotrans-shot {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(126, 131, 135, 0.28);
      border-radius: 8px;
      background: #020407;
    }

    .gotrans-shot--primary {
      grid-row: span 2;
    }

    .gotrans-shot img {
      display: block;
      width: 100%;
      height: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #020407;
    }

    .gotrans-shot figcaption {
      position: absolute;
      right: 10px;
      bottom: 10px;
      left: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid rgba(126, 131, 135, 0.2);
      border-radius: 6px;
      padding: 7px 9px;
      background: rgba(3, 7, 11, 0.84);
      color: var(--text-muted);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.07em;
      line-height: 1.35;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .gotrans-shot figcaption span:last-child {
      color: var(--system-blue-soft);
      text-align: right;
    }

    .gotrans-intro {
      display: grid;
      grid-template-columns: minmax(250px, 0.72fr) minmax(0, 1.28fr);
      gap: clamp(24px, 4vw, 54px);
      align-items: start;
      margin-top: clamp(28px, 4vw, 48px);
      padding: 0 clamp(4px, 1vw, 10px);
    }

    .gotrans-logo-lockup {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .gotrans-logo {
      display: block;
      width: clamp(66px, 9vw, 104px);
      height: auto;
      filter: drop-shadow(0 14px 24px rgba(143, 9, 17, 0.18));
    }

    .gotrans-eyebrow {
      color: var(--system-blue-soft);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1.6;
    }

    .gotrans-featured .gotrans-title {
      margin-top: 3px;
      font-size: clamp(38px, 5vw, 58px);
      letter-spacing: -0.055em;
      line-height: 0.98;
    }

    .gotrans-headline {
      margin-top: 0;
      color: var(--system-blue-soft);
      font-size: clamp(18px, 2vw, 23px);
      font-weight: 650;
      line-height: 1.4;
    }

    .gotrans-masthead-note {
      min-width: 0;
      border-left: 1px solid rgba(126, 131, 135, 0.26);
      padding-left: clamp(18px, 3vw, 30px);
    }

    .gotrans-status-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
      gap: 8px 14px;
      margin-top: 20px;
    }

    .gotrans-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(126, 131, 135, 0.3);
      border-radius: 999px;
      padding: 7px 10px;
      color: var(--system-blue-soft);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .gotrans-status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--system-blue);
      box-shadow: 0 0 12px rgba(255, 24, 37, 0.52);
      content: "";
    }

    .gotrans-overview {
      min-width: 0;
    }

    .gotrans-summary {
      display: grid;
      gap: 11px;
    }

    .gotrans-featured .gotrans-summary p {
      margin-top: 0;
      font-size: 13px;
      line-height: 1.65;
    }

    .gotrans-delivery {
      display: grid;
      gap: 8px;
      margin-top: 22px;
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }

    .gotrans-intro > .gotrans-delivery {
      margin-top: 0;
      border-top: 0;
      border-left: 1px solid var(--line);
      padding-top: 0;
      padding-left: clamp(18px, 3vw, 30px);
    }

    .gotrans-delivery p {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 10px;
      margin-top: 0;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .gotrans-delivery strong {
      color: var(--copper);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    .gotrans-overview .project-tags {
      margin-top: 22px;
    }

    .gotrans-pillars {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: clamp(22px, 3vw, 34px);
    }

    .gotrans-pillar,
    .gotrans-case-block,
    .gotrans-architecture,
    .gotrans-validation,
    .gotrans-finding {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(5, 9, 13, 0.58);
    }

    .gotrans-pillar {
      min-height: 190px;
      padding: clamp(18px, 2vw, 24px);
    }

    .gotrans-pillar-index {
      color: var(--copper);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
    }

    .gotrans-pillar h4 {
      margin-top: 28px;
      color: var(--text);
      font-size: 17px;
      letter-spacing: -0.01em;
    }

    .gotrans-featured .gotrans-pillar p {
      margin-top: 10px;
      font-size: 12.5px;
      line-height: 1.65;
    }

    .gotrans-case-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .gotrans-case-block {
      padding: clamp(18px, 2vw, 24px);
    }

    .gotrans-case-label {
      color: var(--copper);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .gotrans-case-block h4 {
      margin-top: 12px;
      color: var(--text);
      font-size: 18px;
    }

    .gotrans-featured .gotrans-case-block p {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.65;
    }

    .gotrans-architecture {
      margin-top: 12px;
      padding: clamp(20px, 3vw, 32px);
      scroll-margin-top: 20px;
    }

    .gotrans-section-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 10px 24px;
    }

    .gotrans-section-heading h4 {
      margin-top: 8px;
      color: var(--text);
      font-size: clamp(22px, 3vw, 31px);
      letter-spacing: -0.035em;
      line-height: 1.08;
    }

    .gotrans-section-heading p {
      max-width: 560px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .gotrans-architecture-map {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 24px;
    }

    .gotrans-architecture-layer {
      min-width: 0;
      border: 1px solid rgba(126, 131, 135, 0.17);
      border-radius: 7px;
      padding: 16px;
      background: rgba(3, 7, 10, 0.62);
    }

    .gotrans-architecture-layer strong,
    .gotrans-node strong {
      display: block;
      color: var(--system-blue-soft);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 9px;
      letter-spacing: 0.07em;
      line-height: 1.45;
    }

    .gotrans-nodes {
      display: grid;
      gap: 8px;
      margin-top: 13px;
    }

    .gotrans-node {
      border-left: 2px solid rgba(227, 6, 19, 0.52);
      padding: 8px 9px;
      background: rgba(227, 6, 19, 0.035);
    }

    .gotrans-node.is-development {
      border-left-color: var(--copper);
    }

    .gotrans-node.is-planned {
      border-left-style: dashed;
      border-left-color: var(--text-dim);
    }

    .gotrans-node span {
      display: block;
      margin-top: 4px;
      color: var(--text-dim);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 8px;
      letter-spacing: 0.06em;
      line-height: 1.45;
    }

    .gotrans-validation {
      margin-top: 12px;
      padding: clamp(22px, 3.5vw, 38px);
      border-color: rgba(126, 131, 135, 0.32);
      background:
        linear-gradient(135deg, rgba(227, 6, 19, 0.055), transparent 38%),
        rgba(5, 9, 13, 0.74);
    }

    .gotrans-validation-lead {
      max-width: 760px;
      margin-top: 14px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .gotrans-metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
      margin-top: 26px;
    }

    .gotrans-metric {
      min-width: 0;
      border: 1px solid rgba(126, 131, 135, 0.18);
      border-radius: 7px;
      padding: 15px;
      background: rgba(2, 6, 9, 0.68);
    }

    .gotrans-metric-label,
    .gotrans-metric-status {
      color: var(--text-dim);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.4;
    }

    .gotrans-metric-value {
      display: block;
      margin-top: 11px;
      color: var(--system-blue-soft);
      font-size: clamp(23px, 3vw, 34px);
      font-weight: 760;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    .gotrans-metric p {
      margin-top: 10px;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .gotrans-metric-status {
      display: block;
      margin-top: 13px;
      color: var(--copper);
    }

    .gotrans-finding {
      display: grid;
      grid-template-columns: minmax(180px, 0.42fr) minmax(0, 1fr);
      gap: clamp(20px, 4vw, 48px);
      align-items: center;
      margin-top: 12px;
      padding: clamp(20px, 3vw, 30px);
      border-color: rgba(201, 135, 82, 0.32);
    }

    .gotrans-finding h4 {
      margin-top: 8px;
      color: var(--text);
      font-size: clamp(20px, 2.8vw, 28px);
      letter-spacing: -0.035em;
      line-height: 1.1;
    }

    .gotrans-finding p {
      margin-top: 0;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .project-card {
      align-self: start;
      padding: 14px;
    }

    .project-card .project-copy {
      padding: 12px 10px 14px;
    }

    .project-gallery {
      position: relative;
      width: 100%;
      height: 220px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #05070a;
    }

    .project-gallery img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 700ms ease-in-out;
    }

    .project-gallery img.active {
      opacity: 1;
    }

    .project-gallery.portrait-gallery {
      height: 320px;
    }

    .project-gallery.portrait-gallery img {
      object-fit: contain;
    }

    .glikemia-project {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: minmax(300px, 0.82fr) minmax(0, 1.35fr);
      gap: clamp(18px, 3vw, 36px);
      padding: clamp(14px, 2vw, 22px);
    }

    .glikemia-project .project-gallery {
      height: clamp(500px, 56vw, 680px);
      align-self: start;
    }

    .glikemia-project .project-copy {
      min-width: 0;
      padding: clamp(12px, 2vw, 22px) 0;
    }

    .glikemia-project h3 {
      font-size: clamp(28px, 4vw, 44px);
    }

    .glikemia-project .project-headline {
      color: var(--system-blue-soft);
      font-size: clamp(18px, 2.2vw, 24px);
      line-height: 1.45;
    }

    .project-description {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .project-description p {
      margin-top: 0;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 24px;
      list-style: none;
    }

    .project-tags li {
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(126, 131, 135, 0.06);
      color: var(--system-blue-soft);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1.2;
    }

    .project-highlights {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 24px;
      list-style: none;
    }

    .project-highlights li {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: rgba(6, 10, 14, 0.46);
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .project-highlights strong {
      display: block;
      margin-bottom: 6px;
      color: var(--copper);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stat-box {
      margin-top: 18px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
      color: var(--text-dim);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .stat-num {
      color: var(--system-blue-soft);
      font-weight: 800;
    }

    .contact-card {
      display: grid;
      min-height: min(520px, 62vh);
      place-items: center;
      padding: clamp(34px, 7vw, 76px);
      text-align: center;
    }

    .contact-content {
      max-width: 760px;
    }

    .contact-card h2 {
      margin-top: 20px;
      font-size: clamp(34px, 5.4vw, 62px);
      letter-spacing: -0.04em;
      line-height: 1.02;
    }

    .contact-card p {
      margin-top: 24px;
      color: var(--text-muted);
      font-size: 17px;
      line-height: 1.75;
    }

    .contact-email {
      display: inline-block;
      margin-top: 20px;
      color: var(--system-blue-soft);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 14px;
      text-decoration: none;
    }

    .contact-card .actions {
      justify-content: center;
    }

    .brief-card {
      padding: clamp(24px, 5vw, 54px);
    }

    .brief-card > h2 {
      margin-top: 12px;
      font-size: clamp(30px, 4.5vw, 48px);
      letter-spacing: -0.03em;
    }

    .brief-intro {
      max-width: 760px;
      margin-top: 16px;
      color: var(--text-muted);
      line-height: 1.7;
    }

    .brief-section {
      margin-top: 34px;
      border-top: 1px solid var(--line);
      padding-top: 26px;
    }

    .brief-section h3 {
      color: var(--system-blue-soft);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 13px;
      letter-spacing: 0.12em;
    }

    .brief-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .brief-item label {
      display: block;
      min-height: 44px;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .brief-item textarea {
      width: 100%;
      min-height: 108px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px;
      background: rgba(4, 7, 10, 0.7);
      color: var(--text);
      line-height: 1.55;
      transition:
        border-color 160ms ease,
        background 160ms ease;
    }

    .brief-item textarea:focus {
      border-color: var(--line-strong);
      background: rgba(6, 10, 14, 0.92);
    }

    #statusbar {
      z-index: 50;
      display: flex;
      min-height: 34px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-top: 1px solid var(--line);
      padding: 8px clamp(16px, 4vw, 48px);
      background: rgba(7, 10, 14, 0.98);
      color: var(--text-dim);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    #statusbar .system-state {
      color: var(--system-blue);
    }

    @media (min-width: 1200px) {
      .tile-grid {
        gap: 22px;
      }

      .project-gallery {
        height: 238px;
      }
    }

    @media (max-width: 960px) {
      #header-console {
        align-items: flex-start;
        flex-direction: column;
        gap: 14px;
        padding-block: 14px;
      }

      .brand-lockup {
        min-width: 0;
      }

      .hero-content {
        max-width: 60%;
      }

      #brand-relief {
        right: -142px;
        width: min(58vw, 490px);
        opacity: 0.78;
      }

      .nav-horizontal {
        width: 100%;
        justify-content: flex-start;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: none;
      }

      .nav-horizontal::-webkit-scrollbar {
        display: none;
      }

      .nav-item {
        flex: 0 0 auto;
      }

      .area-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .area-card:last-child {
        grid-column: 1 / -1;
      }

      .process-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .gotrans-gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .gotrans-shot--primary {
        grid-row: auto;
        grid-column: 1 / -1;
      }

      .gotrans-intro {
        grid-template-columns: 1fr;
      }

      .gotrans-masthead {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .gotrans-masthead-note {
        border-top: 1px solid rgba(126, 131, 135, 0.26);
        border-left: 0;
        padding-top: 18px;
        padding-left: 0;
      }

      .gotrans-intro > .gotrans-delivery {
        border-top: 1px solid var(--line);
        border-left: 0;
        padding-top: 18px;
        padding-left: 0;
      }

      .gotrans-metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 820px) {
      .gotrans-pillars,
      .gotrans-case-grid,
      .gotrans-architecture-map,
      .gotrans-finding {
        grid-template-columns: 1fr;
      }

      .gotrans-pillar {
        min-height: 0;
      }

      .glikemia-project {
        grid-template-columns: 1fr;
      }

      .glikemia-project .project-gallery {
        min-height: 480px;
        height: min(68vh, 620px);
      }
    }

    @media (max-width: 620px) {
      #header-console {
        padding: 12px 14px 10px;
      }

      .brand-lockup h1 {
        font-size: 16px;
        letter-spacing: 0.1em;
      }

      .brand-lockup p {
        font-size: 8px;
        letter-spacing: 0.09em;
      }

      .brand-symbol {
        width: 32px;
        flex-basis: 32px;
      }

      .nav-horizontal {
        gap: 4px;
      }

      .nav-item {
        padding: 8px 10px;
        font-size: 9.5px;
      }

      #panel {
        padding: 18px 12px 46px;
      }

      .hero-card {
        min-height: 470px;
        padding: 28px 20px;
      }

      .hero-content {
        max-width: none;
      }

      #brand-relief {
        top: 46%;
        right: -202px;
        width: 390px;
        opacity: 0.46;
        pointer-events: none;
      }

      .system-stamp {
        --stamp-size: 50px;
        opacity: 0.5;
      }

      .system-stamp--approach,
      .system-stamp--work,
      .system-stamp--areas,
      .system-stamp--contact,
      .system-stamp--brief {
        display: none;
      }

      .system-stamp--process {
        top: 2px;
        right: 4px;
      }

      .hero-card h2 {
        margin-top: 20px;
        font-size: clamp(35px, 11vw, 50px);
      }

      .hero-card p {
        margin-top: 22px;
        font-size: 15px;
        line-height: 1.65;
      }

      .actions,
      .contact-card .actions {
        display: grid;
        grid-template-columns: 1fr;
        width: 100%;
      }

      .cta-button {
        width: 100%;
      }

      .tile-grid,
      .area-grid,
      .process-grid,
      .brief-fields {
        grid-template-columns: 1fr;
      }

      .area-card:last-child {
        grid-column: auto;
      }

      .tile {
        padding: 20px;
      }

      .project-card {
        padding: 10px;
      }

      .gotrans-featured {
        padding: 10px;
      }

      .gotrans-gallery,
      .gotrans-metrics {
        grid-template-columns: 1fr;
      }

      .gotrans-delivery p {
        grid-template-columns: 1fr;
        gap: 4px;
      }

      .gotrans-shot--primary {
        grid-column: auto;
      }

      .project-gallery {
        height: 210px;
      }

      .project-gallery.portrait-gallery {
        height: 360px;
      }

      .glikemia-project .project-gallery.portrait-gallery {
        min-height: 420px;
        height: min(68vh, 540px);
      }

      .project-highlights {
        grid-template-columns: 1fr;
      }

      .contact-card {
        min-height: 480px;
        padding: 30px 20px;
      }

      .contact-card p {
        font-size: 15px;
      }

      .brief-item label {
        min-height: 0;
      }

      #statusbar {
        padding-inline: 12px;
        font-size: 8px;
        letter-spacing: 0.04em;
      }
    }

    /* Industrial precision dossier */
    body {
      background: var(--surface-0);
    }

    #background-surface {
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
        radial-gradient(circle at 78% 30%, rgba(227, 6, 19, 0.055), transparent 27%),
        linear-gradient(145deg, #0a0a0b 0%, #050505 54%, #080808 100%);
      background-size: 80px 80px, 80px 80px, auto, auto;
    }

    #background-surface::before {
      position: absolute;
      inset: 0;
      background-image: url("zdjtlo.png");
      background-position: center;
      background-size: cover;
      content: "";
      filter: grayscale(1) contrast(1.25);
      mix-blend-mode: soft-light;
      opacity: 0.035;
    }

    #background-surface::after {
      background-image:
        repeating-linear-gradient(104deg, transparent 0 97px, rgba(255, 255, 255, 0.012) 98px, transparent 99px),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.012) 0 1px, transparent 1px 3px);
      background-size: auto;
      mask-image: radial-gradient(ellipse at center, #000 18%, transparent 88%);
      opacity: 0.65;
    }

    #atmosphere {
      background:
        linear-gradient(180deg, rgba(5, 6, 7, 0.08), rgba(5, 6, 7, 0.3)),
        radial-gradient(ellipse at center, transparent 22%, rgba(1, 2, 3, 0.46) 100%);
    }

    #header-console {
      padding: 14px clamp(20px, 3.2vw, 58px);
      border-bottom-color: rgba(255, 31, 50, 0.42);
      background: rgba(5, 6, 7, 0.94);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.34);
    }

    #header-console::after {
      position: absolute;
      bottom: -1px;
      left: clamp(20px, 3.2vw, 58px);
      width: clamp(90px, 11vw, 168px);
      height: 1px;
      background: var(--signal);
      box-shadow: 0 0 6px rgba(255, 31, 50, 0.65), 0 0 16px rgba(255, 31, 50, 0.18);
      content: "";
    }

    .brand-symbol {
      position: relative;
      width: 42px;
      flex-basis: 42px;
      filter: grayscale(1) contrast(1.14) drop-shadow(0 0 8px rgba(255, 24, 37, 0.28));
    }

    .brand-symbol::after {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 52% 46%, rgba(255, 24, 37, 0.78), rgba(227, 6, 19, 0.28) 35%, transparent 68%);
      content: "";
      -webkit-mask: var(--brand-primary) center / contain no-repeat;
      mask: var(--brand-primary) center / contain no-repeat;
      mix-blend-mode: screen;
    }

    .brand-lockup h1 {
      color: var(--text);
      font-size: clamp(16px, 1.65vw, 21px);
      font-weight: 820;
      letter-spacing: 0.12em;
    }

    .brand-lockup p {
      color: var(--steel);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .nav-horizontal {
      gap: clamp(10px, 1.5vw, 24px);
    }

    .nav-item {
      position: relative;
      overflow: visible;
      border: 0;
      border-radius: 0;
      padding: 10px 0;
      color: var(--text-dim);
      font-size: clamp(13px, 0.78vw, 15px);
      font-weight: 800;
      letter-spacing: 0.045em;
    }

    .nav-item::after {
      position: absolute;
      right: 0;
      bottom: 3px;
      left: 0;
      height: 1px;
      background: var(--signal);
      box-shadow: 0 0 7px rgba(255, 31, 50, 0.48);
      content: "";
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 180ms ease;
    }

    .nav-item:hover,
    .nav-item.active {
      border-color: transparent;
      background: transparent;
      box-shadow: none;
      color: var(--text);
    }

    .nav-item:is(:hover, .active)::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .nav-item.active {
      color: var(--text);
      font-weight: 900;
      text-shadow: 0 0 10px rgba(255, 24, 37, 0.22);
    }

    #panel {
      width: 100%;
      padding: 0 clamp(18px, 3.5vw, 64px) 64px;
    }

    #p-content {
      min-height: 100%;
      max-width: 1540px;
    }

    .module-section:not(.hero-card) {
      padding-top: clamp(34px, 5vw, 72px);
    }

    .panel-card,
    .tile {
      border-color: rgba(169, 176, 183, 0.16);
      border-radius: 2px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.018), transparent 31%),
        var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.025);
    }

    .panel-card::before,
    .tile::before {
      width: 96px;
      background: var(--signal);
      box-shadow: 0 0 6px rgba(255, 31, 50, 0.5), 0 0 16px rgba(255, 31, 50, 0.14);
    }

    .tile::after,
    .contact-card::after,
    .brief-card::after {
      position: absolute;
      right: -1px;
      bottom: -1px;
      width: 17px;
      height: 17px;
      border-right: 1px solid var(--signal-dark);
      border-bottom: 1px solid var(--signal-dark);
      content: "";
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .tile:hover::after {
      border-color: var(--signal);
      box-shadow: 4px 4px 11px rgba(255, 31, 50, 0.13);
    }

    .hero-card {
      display: grid;
      min-height: max(620px, calc(100vh - 112px));
      grid-template-columns: minmax(0, 1.06fr) minmax(320px, 0.94fr);
      align-items: center;
      overflow: visible;
      border: 0;
      border-radius: 0;
      padding: clamp(52px, 7vh, 88px) 0 clamp(46px, 7vh, 82px);
      background: transparent;
      box-shadow: none;
    }

    .hero-card::before {
      top: auto;
      bottom: 34px;
      left: 0;
      width: min(48vw, 620px);
      height: 1px;
      background: linear-gradient(90deg, var(--signal), rgba(255, 31, 50, 0.12), transparent);
      box-shadow: 0 0 6px rgba(255, 31, 50, 0.36);
    }

    .hero-card::after {
      position: absolute;
      top: 12%;
      right: 4%;
      bottom: 12%;
      width: 1px;
      background: linear-gradient(transparent, rgba(255, 31, 50, 0.5) 20%, rgba(255, 31, 50, 0.15) 78%, transparent);
      content: "";
    }

    .hero-content {
      z-index: 4;
      max-width: 910px;
      padding-left: clamp(8px, 2vw, 28px);
    }

    .eyebrow,
    .section-kicker {
      color: var(--steel);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.11em;
    }

    .eyebrow::before,
    .section-kicker::before {
      width: clamp(40px, 6vw, 92px);
      background: var(--signal);
      box-shadow: 0 0 6px rgba(255, 31, 50, 0.65), 0 0 16px rgba(255, 31, 50, 0.18);
    }

    .hero-card h2 {
      max-width: 900px;
      margin-top: 26px;
      color: var(--text);
      font-family: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      font-size: clamp(54px, 5.7vw, 92px);
      font-stretch: condensed;
      font-weight: 900;
      letter-spacing: -0.055em;
      line-height: 0.82;
      text-transform: uppercase;
    }

    .hero-card h2 span {
      margin-top: 0.12em;
      color: var(--text);
      text-shadow: none;
    }

    .hero-card h2 .hero-headline-line {
      display: block;
      margin-top: 0.08em;
      color: var(--text);
    }

    .hero-card h2 .hero-headline-line:first-child {
      margin-top: 0;
    }

    .hero-card h2.headline-accent .hero-headline-accent {
      color: var(--signal-bright);
      text-shadow: 0 0 8px rgba(255, 24, 37, 0.24), 0 0 24px rgba(255, 24, 37, 0.08);
    }

    .hero-card p {
      max-width: 680px;
      margin-top: 32px;
      color: var(--steel);
      font-size: clamp(14px, 1.35vw, 17px);
      line-height: 1.72;
    }

    .hero-capabilities {
      margin-top: 20px;
      color: var(--text-dim);
      font-size: 9px;
      letter-spacing: 0.13em;
    }

    .hero-capabilities span + span::before {
      color: var(--signal);
    }

    .hero-tech-meta {
      position: absolute;
      z-index: 5;
      top: 11%;
      right: 1.4%;
      display: grid;
      gap: 17px;
      color: var(--steel-dark);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 8px;
      letter-spacing: 0.17em;
      line-height: 1.25;
      text-transform: uppercase;
    }

    .hero-tech-meta span {
      display: block;
      margin-top: 3px;
      color: var(--text);
      font-size: 10px;
    }

    .hero-tech-meta .is-online {
      color: var(--signal-bright);
    }

    .hero-tech-meta .is-online::before {
      display: inline-block;
      width: 5px;
      height: 5px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--signal-bright);
      box-shadow: 0 0 8px rgba(255, 24, 37, 0.55), 0 0 24px rgba(255, 24, 37, 0.12);
      content: "";
      animation: statusPulse 2.8s ease-in-out infinite;
    }

    .hero-coordinate {
      position: absolute;
      z-index: 5;
      right: 6.3%;
      bottom: 9%;
      color: var(--signal);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 8px;
      letter-spacing: 0.16em;
      writing-mode: vertical-rl;
    }

    .hero-crosshair {
      position: absolute;
      z-index: 5;
      top: 54%;
      right: 2.15%;
      width: 22px;
      height: 22px;
      border: 1px solid rgba(255, 31, 50, 0.68);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 31, 50, 0.12);
    }

    .hero-crosshair::before,
    .hero-crosshair::after {
      position: absolute;
      top: 50%;
      left: 50%;
      background: var(--signal);
      content: "";
      transform: translate(-50%, -50%);
    }

    .hero-crosshair::before {
      width: 34px;
      height: 1px;
    }

    .hero-crosshair::after {
      width: 1px;
      height: 34px;
    }

    @keyframes statusPulse {
      50% { opacity: 0.48; }
    }

    #brand-relief {
      z-index: 2;
      top: 50%;
      right: clamp(-250px, -10vw, -118px);
      width: clamp(660px, 58vw, 960px);
      opacity: 0.94;
      transform: translateY(-50%);
    }

    #brand-relief::before {
      position: absolute;
      z-index: 4;
      top: 10%;
      right: 17%;
      width: 26%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--signal));
      box-shadow: 0 0 7px rgba(255, 31, 50, 0.34);
      content: "";
      pointer-events: none;
    }

    .brand-relief__image {
      filter: grayscale(1) contrast(1.12) brightness(0.92) drop-shadow(0 28px 42px rgba(0, 0, 0, 0.58));
      opacity: 0.96;
    }

    #brand-relief.is-active .brand-relief__image {
      filter: grayscale(1) contrast(1.16) brightness(0.98) drop-shadow(0 30px 46px rgba(0, 0, 0, 0.62));
    }

    .brand-relief__light {
      background: radial-gradient(circle at var(--pointer-x) var(--pointer-y), rgba(255, 24, 37, 0.74) 0%, rgba(227, 6, 19, 0.34) 20%, rgba(143, 9, 17, 0.08) 44%, transparent 62%);
      mix-blend-mode: screen;
      opacity: 0.38;
    }

    #brand-relief.is-active .brand-relief__light {
      opacity: 0.62;
    }

    .brand-relief__sheen {
      background-image: linear-gradient(112deg, transparent 36%, rgba(215, 215, 211, 0.02) 43%, rgba(244, 244, 242, 0.34) 48%, rgba(255, 24, 37, 0.12) 51%, transparent 59%);
    }

    .actions {
      gap: 10px;
    }

    .cta-button {
      min-height: 48px;
      border-color: rgba(255, 24, 37, 0.72);
      border-radius: 2px;
      padding: 12px 19px;
      background: #e30613;
      box-shadow: inset 0 1px 0 rgba(244, 244, 242, 0.18), 0 8px 24px rgba(227, 6, 19, 0.18);
      letter-spacing: 0.12em;
    }

    .cta-button::after {
      margin-left: 12px;
      color: currentColor;
      content: "→";
      font-size: 15px;
      line-height: 1;
    }

    .cta-button:is(:hover, :focus-visible) {
      border-color: var(--signal-bright);
      background: #ff1825;
      box-shadow: inset 0 1px 0 rgba(244, 244, 242, 0.2), 0 10px 28px rgba(227, 6, 19, 0.24);
    }

    .cta-button.secondary {
      border-color: rgba(169, 176, 183, 0.46);
      background: rgba(9, 12, 15, 0.72);
      box-shadow: none;
      color: var(--steel);
    }

    .cta-button.secondary:is(:hover, :focus-visible) {
      border-color: var(--signal);
      background: rgba(13, 17, 21, 0.9);
      box-shadow: 0 0 8px rgba(255, 31, 50, 0.16), 0 0 18px rgba(255, 31, 50, 0.06);
      color: var(--text);
    }

    .cta-button.secondary:is(:hover, :focus-visible)::after {
      color: var(--signal);
    }

    .section-intro {
      position: relative;
      border-bottom-color: rgba(255, 31, 50, 0.32) !important;
      padding-bottom: 18px;
    }

    .section-intro::after {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: clamp(72px, 12vw, 180px);
      height: 1px;
      background: var(--signal);
      box-shadow: 0 0 7px rgba(255, 31, 50, 0.35);
      content: "";
    }

    .section-intro h2,
    .contact-card h2,
    .brief-card > h2 {
      font-family: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      font-weight: 900;
      letter-spacing: -0.035em;
      text-transform: uppercase;
    }

    .section-intro h2 {
      font-size: clamp(38px, 5vw, 68px);
    }

    .tile-header,
    .gotrans-case-label,
    .process-card .step-index,
    .project-highlights strong {
      color: var(--signal);
      text-shadow: 0 0 8px rgba(255, 31, 50, 0.16);
    }

    .signal-list li::before {
      background: var(--signal);
      box-shadow: 0 0 6px rgba(255, 31, 50, 0.38);
    }

    .area-card,
    .process-card {
      min-height: 230px;
    }

    .gotrans-featured {
      border-color: rgba(169, 176, 183, 0.2);
      border-radius: 2px;
      background: linear-gradient(145deg, rgba(227, 6, 19, 0.035), transparent 31%), var(--panel);
    }

    .gotrans-featured::before {
      background: linear-gradient(90deg, var(--signal), transparent);
      box-shadow: 0 0 7px rgba(255, 31, 50, 0.3);
    }

    .gotrans-featured::after {
      position: absolute;
      top: 18px;
      right: 20px;
      bottom: auto;
      width: auto;
      height: auto;
      border: 0;
      color: var(--signal);
      content: "CASE_001";
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 9px;
      letter-spacing: 0.16em;
    }

    .gotrans-eyebrow,
    .gotrans-status,
    .gotrans-metric-value,
    .stat-num,
    .project-tags li {
      color: var(--white-primary, #f4f4f2);
    }

    .project-gallery,
    .project-highlights li,
    .brief-item textarea {
      border-radius: 1px;
    }

    .project-tags li {
      border-color: rgba(126, 131, 135, 0.34);
      border-radius: 2px;
      background: rgba(126, 131, 135, 0.055);
    }

    .selected-work-grid {
      counter-reset: case-file 1;
    }

    .selected-work-grid > .project-card {
      counter-increment: case-file;
    }

    .selected-work-grid > .project-card::before {
      width: auto;
      height: auto;
      background: none;
      box-shadow: none;
      color: var(--signal);
      content: "CASE_00" counter(case-file);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-shadow: 0 0 8px rgba(255, 31, 50, 0.26);
    }

    .project-card .project-copy {
      padding-top: 28px;
    }

    .contact-card {
      border-left: 1px solid rgba(255, 31, 50, 0.26);
    }

    .contact-email:hover {
      color: var(--signal);
      text-shadow: 0 0 8px rgba(255, 31, 50, 0.22);
    }

    .brief-section {
      border-top-color: rgba(255, 31, 50, 0.28);
    }

    .brief-section h3 {
      color: var(--signal);
    }

    .brief-item textarea:focus {
      border-color: var(--signal);
      box-shadow: 0 0 0 1px rgba(255, 31, 50, 0.12), 0 0 12px rgba(255, 31, 50, 0.07);
      outline: 0;
    }

    #statusbar {
      border-top-color: rgba(255, 31, 50, 0.38);
      background: rgba(5, 6, 7, 0.96);
      color: var(--steel-dark);
    }

    #statusbar .system-state {
      color: var(--steel-dark);
    }

    #statusbar .system-state::before {
      display: inline-block;
      width: 5px;
      height: 5px;
      margin-right: 9px;
      border-radius: 50%;
      background: var(--signal-bright);
      box-shadow: 0 0 8px rgba(255, 24, 37, 0.58);
      content: "";
    }

    #sys-time {
      color: var(--signal);
    }

    /* Remove the former blue interface language from detailed modules. */
    .gotrans-featured,
    .gotrans-shot,
    .gotrans-status,
    .gotrans-node,
    .gotrans-validation,
    .gotrans-metric,
    .project-gallery,
    .project-highlights li {
      border-color: rgba(126, 131, 135, 0.24);
    }

    .gotrans-masthead-note,
    .gotrans-intro > .gotrans-delivery {
      border-color: rgba(126, 131, 135, 0.24);
    }

    .gotrans-node.is-development,
    .gotrans-validation {
      background: linear-gradient(135deg, rgba(227, 6, 19, 0.035), transparent 38%), var(--panel);
    }

    .gotrans-status::before {
      background: var(--signal-bright);
      box-shadow: 0 0 10px rgba(255, 24, 37, 0.55);
    }

    .gotrans-eyebrow,
    .gotrans-headline,
    .gotrans-status,
    .gotrans-metric-value,
    .stat-num,
    .contact-email,
    .featured-intro .section-kicker {
      color: var(--white-primary, #f4f4f2);
    }

    .offer-hierarchy {
      margin-bottom: clamp(54px, 8vw, 110px);
      padding-top: clamp(70px, 9vw, 126px) !important;
      border-top: 1px solid rgba(227, 6, 19, 0.38);
    }

    .offer-heading {
      display: grid;
      max-width: 940px;
      gap: 22px;
      margin-bottom: clamp(34px, 5vw, 64px);
    }

    .offer-heading h2 {
      color: var(--text);
      font-family: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      font-size: clamp(46px, 6.2vw, 88px);
      font-weight: 900;
      letter-spacing: -0.045em;
      line-height: 0.94;
    }

    .offer-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border-top: 1px solid rgba(126, 131, 135, 0.28);
      border-left: 1px solid rgba(126, 131, 135, 0.28);
    }

    .offer-file {
      position: relative;
      min-height: 260px;
      overflow: hidden;
      border: 0;
      border-right: 1px solid rgba(126, 131, 135, 0.28);
      border-bottom: 1px solid rgba(126, 131, 135, 0.28);
      border-radius: 0;
      padding: clamp(28px, 4vw, 54px);
      background: rgba(10, 10, 11, 0.78);
      color: var(--text);
      text-align: left;
      transition: background 180ms ease, border-color 180ms ease;
    }

    .offer-file::before {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--signal-bright);
      box-shadow: 0 0 8px rgba(255, 24, 37, 0.48);
      content: "";
      transition: width 220ms ease;
    }

    .offer-file:hover::before,
    .offer-file:focus-visible::before {
      width: 42%;
    }

    .offer-index {
      display: block;
      margin-bottom: clamp(42px, 6vw, 78px);
      color: var(--signal-bright);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-shadow: 0 0 8px rgba(255, 24, 37, 0.28);
    }

    .offer-file h3,
    .offer-action-title {
      display: block;
      color: var(--text);
      font-family: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      font-size: clamp(28px, 3.4vw, 48px);
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 1;
    }

    .offer-file p,
    .offer-action-copy {
      display: block;
      max-width: 580px;
      margin-top: 18px;
      color: var(--steel);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      line-height: 1.7;
      text-transform: uppercase;
    }

    .offer-file--action {
      cursor: pointer;
    }

    .offer-file--action:hover,
    .offer-file--action:focus-visible {
      background: rgba(16, 16, 17, 0.96);
    }

    .offer-arrow {
      position: absolute;
      right: clamp(28px, 4vw, 54px);
      bottom: clamp(28px, 4vw, 54px);
      color: var(--signal-bright);
      font-size: 28px;
      transition: transform 180ms ease;
    }

    .offer-file--action:hover .offer-arrow,
    .offer-file--action:focus-visible .offer-arrow {
      transform: translateX(6px);
    }

    @media (max-width: 1100px) {
      .hero-card {
        min-height: max(600px, calc(100vh - 150px));
        grid-template-columns: minmax(0, 1fr) minmax(220px, 0.58fr);
      }

      .hero-card h2 {
        font-size: clamp(48px, 6.8vw, 72px);
      }

      #brand-relief {
        right: -220px;
        width: min(72vw, 780px);
        opacity: 0.76;
      }

      .hero-tech-meta {
        display: none;
      }
    }

    @media (max-width: 760px) {
      #header-console {
        gap: 10px;
        padding: 10px 14px 8px;
      }

      .brand-symbol {
        width: 34px;

    /* Progressive case-study library: lightweight covers first, evidence on demand. */
    .case-library {
      display: grid;
      gap: clamp(28px, 5vw, 64px);
      margin-top: clamp(30px, 5vw, 58px);
    }

    .case-cover {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.22fr) minmax(330px, 0.78fr);
      min-height: clamp(520px, 64vw, 720px);
      overflow: clip;
      border: 1px solid rgba(126, 131, 135, 0.3);
      background: var(--bg-surface, #0a0a0b);
      box-shadow: 0 28px 76px rgba(0, 0, 0, 0.38);
      content-visibility: auto;
      contain-intrinsic-size: auto 680px;
    }

    .case-cover::before {
      position: absolute;
      z-index: 4;
      top: -1px;
      left: -1px;
      width: clamp(88px, 14vw, 180px);
      height: 2px;
      background: linear-gradient(90deg, var(--signal-bright), transparent);
      box-shadow: 0 0 8px rgba(255, 24, 37, 0.38);
      content: "";
    }

    .case-cover__visual {
      position: relative;
      min-width: 0;
      min-height: 520px;
      overflow: hidden;
      border-right: 1px solid rgba(126, 131, 135, 0.22);
      background: #050505;
      isolation: isolate;
    }

    .case-cover--reverse .case-cover__visual {
      order: 2;
      border-right: 0;
      border-left: 1px solid rgba(126, 131, 135, 0.22);
    }

    .case-cover__visual::after {
      position: absolute;
      z-index: 2;
      inset: 0;
      background:
        linear-gradient(180deg, transparent 56%, rgba(5, 5, 5, 0.76)),
        linear-gradient(90deg, rgba(5, 5, 5, 0.14), transparent 35%);
      content: "";
      pointer-events: none;
    }

    .case-cover__visual > img:not(.case-cover__logo) {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.88) contrast(1.04);
      transition: transform 420ms ease, filter 420ms ease;
    }

    .case-cover:hover .case-cover__visual > img:not(.case-cover__logo) {
      transform: scale(1.012);
      filter: saturate(1) contrast(1.04);
    }

    .case-cover__logo {
      position: absolute;
      z-index: 3;
      top: clamp(22px, 3vw, 38px);
      left: clamp(22px, 3vw, 38px);
      width: clamp(64px, 7vw, 92px);
      height: auto;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.58));
    }

    .case-cover__visual-label {
      position: absolute;
      z-index: 3;
      right: clamp(18px, 2vw, 28px);
      bottom: clamp(18px, 2vw, 28px);
      color: var(--white-secondary, #d7d7d3);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 9px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .case-cover__copy {
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: center;
      padding: clamp(34px, 4vw, 56px);
      background:
        linear-gradient(145deg, rgba(227, 6, 19, 0.04), transparent 35%),
        var(--bg-surface, #0a0a0b);
    }

    .case-cover--reverse .case-cover__copy {
      order: 1;
    }

    .case-cover__index,
    .case-cover__status {
      color: var(--signal-bright);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .case-cover__copy h3 {
      margin-top: clamp(22px, 3vw, 36px);

      font-family: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      font-size: clamp(42px, 4.8vw, 62px);
      font-weight: 900;
      letter-spacing: -0.045em;
      line-height: 0.94;
      text-transform: uppercase;

    .case-cover__summary {

      font-size: clamp(16px, 1.7vw, 20px);

    .case-cover__features {
      display: grid;
      gap: 10px;

    .case-cover__features li {
      position: relative;

      height: 2px;

    .case-cover__footer {

      margin-top: 34px;

    .case-cover__status {
      display: inline-flex;

    .case-cover__status::before {

      border-radius: 50%;

      box-shadow: 0 0 8px rgba(255, 24, 37, 0.52);
      content: "";
    }

    .case-cover__trigger {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border: 1px solid rgba(255, 24, 37, 0.58);
      padding: 12px 16px;
      background: rgba(227, 6, 19, 0.06);
      color: var(--white-primary, #f4f4f2);
      cursor: pointer;
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease;

    .case-cover__trigger::after {

    .case-cover__trigger:hover,

      border-color: var(--signal-bright);
      background: rgba(227, 6, 19, 0.14);
      outline: 0;

    .case-cover__trigger[aria-expanded="true"]::after {
      content: "−";

    .case-cover__detail {
      display: none;
      grid-column: 1 / -1;
      order: 3;
      min-width: 0;
      border-top: 1px solid rgba(255, 24, 37, 0.3);

        inset 0 1px 0 rgba(220, 241, 255, 0.38),
