<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050607">
  <title>@@TITLE@@</title>
  <meta name="description" content="@@DESCRIPTION@@">
  <link rel="canonical" href="@@CANONICAL@@">
  <meta property="og:type" content="website">
  <meta property="og:title" content="@@TITLE@@">
  <meta property="og:description" content="@@DESCRIPTION@@">
  <meta property="og:url" content="@@CANONICAL@@">
  <meta property="og:image" content="https://progresskit.pl/og-progresskit.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="@@TITLE@@">
  <meta name="twitter:description" content="@@DESCRIPTION@@">
  <meta name="twitter:image" content="https://progresskit.pl/og-progresskit.jpg">
  <link rel="icon" href="@@ROOT@@assets/brand/progresskit-mark-small.webp" type="image/webp">
  @@SCENE_ENTRY@@@@PAGE_STYLES@@
  <script src="@@ROOT@@assets/site-v5.js" defer></script>
  @@PAGE_SCRIPTS@@
</head>
<body class="@@BODY_CLASS@@" data-core-state="idle">
  <div class="world-environment" aria-hidden="true"><div class="world-environment__light"></div><div class="world-environment__grain"></div><div class="world-environment__spine"></div></div>
  <a class="skip-link" href="#main">Przejdź do treści</a>
  <header class="topbar">
    <div class="shell topbar__inner">
      <a class="brand" href="@@ROOT@@#start" aria-label="ProgressKit Systems, start">
        <span><span class="brand__title">PROGRESSKIT SYSTEMS</span></span>
      </a>
      <nav class="nav" aria-label="Główna nawigacja">@@NAV@@</nav>
      <button type="button" class="guide-trigger" hidden data-js-only data-guide-toggle data-drone-toggle aria-label="Asystent ProgressKit" aria-controls="guide-panel" aria-expanded="false" data-proximity><img src="@@ROOT@@assets/brand/inspection-drone.webp" width="280" height="186" alt="" aria-hidden="true"><span>Asystent</span></button>
      <button class="menu-btn" type="button" aria-label="Otwórz menu" aria-expanded="false" aria-controls="mobile-menu"><span></span><span></span><span></span></button>
    </div>
    <aside class="world-guide shell" id="guide-panel" aria-label="Asystent ProgressKit" hidden>
      <img src="@@ROOT@@assets/brand/inspection-drone.webp" width="280" height="186" alt="Dron asystenta ProgressKit">
      <div><label>O którym projekcie chcesz się dowiedzieć?<select data-guide-project>@@GUIDE_OPTIONS@@</select></label>
      <p data-guide-copy aria-live="polite"></p><div class="guide-topics"><button type="button" data-guide-topic="summary" aria-pressed="true">Projekt</button><button type="button" data-guide-topic="technology" aria-pressed="false">Technologie</button><button type="button" data-guide-topic="feature" aria-pressed="false">Funkcje</button></div>
      <a data-guide-link href="@@ROOT@@projekty/">Otwórz prezentację</a> · <button type="button" data-guide-close>Zamknij</button> @@MOTION@@</div></aside>
    <nav id="mobile-menu" class="mobile-panel" aria-label="Nawigacja mobilna" hidden>@@NAV@@</nav>
  </header>
  <noscript><nav class="shell fallback-nav" aria-label="Nawigacja bez JavaScript">@@NAV@@</nav></noscript>
  <main id="main" tabindex="-1">@@CONTENT@@</main>
  <footer>
    <div class="shell footer__inner">
      <div class="footer-brand"><img src="@@ROOT@@assets/brand/progresskit-mark-small.webp" width="40" height="40" loading="lazy" alt="" aria-hidden="true"><div><strong>PROGRESSKIT SYSTEMS</strong></div></div>
      <div class="footer__links"><span>© 2026 ProgressKit Systems</span><a href="mailto:pawel@progresskit.pl">E-mail</a><a href="https://www.tiktok.com/@progresskit" target="_blank" rel="noopener noreferrer">TikTok: @progresskit</a><a href="@@ROOT@@glikemia-premium/">Glikemia Premium</a><a href="@@ROOT@@progresskit-mail/">ProgressKit Mail</a><a href="@@ROOT@@prywatnosc/">Prywatność</a><a href="#main">↑ Góra</a></div>
    </div>
  </footer>
  <dialog id="gallery-dialog" class="gallery-dialog" aria-labelledby="gallery-title">
    <div class="gallery-dialog__toolbar"><h2 id="gallery-title">Galeria projektu</h2><button type="button" data-gallery-close aria-label="Zamknij powiększenie">Zamknij ×</button></div>
    <figure><img id="gallery-image" alt=""><figcaption id="gallery-caption"></figcaption></figure>
    <div class="gallery-dialog__controls"><button type="button" data-gallery-prev aria-label="Poprzedni obraz">← Poprzedni</button><span id="gallery-position" aria-live="polite"></span><button type="button" data-gallery-next aria-label="Następny obraz">Następny →</button></div>
  </dialog>
</body>
</html>
