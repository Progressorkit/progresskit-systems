# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Validate catalog and generated pages
        run: |
          python3 scripts/build-site.py --check
          python3 -m unittest discover -s tests -p 'test_catalog_validation.py'
          python3 -m unittest discover -s tests -p 'test_site_v5.py'
          python3 -m unittest discover -s tests -p 'test_site_v4.py'
          python3 -m unittest discover -s tests -p 'test_owner_correction.py'
          node --check assets/site-v5.js
          node --check assets/hero-space.js
          node --check assets/project-showroom.js
          node --check assets/project-hologram.js
          node --check assets/engineering-exhibit.js
          node --check glikemia-premium/product.js
          node --test tests/*.test.cjs
      - name: Require owner visual approval before publication
        run: python3 scripts/check-publication.py
      - name: Stage public files only
        run: python3 scripts/stage-public.py "$RUNNER_TEMP/progresskit-public"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/progresskit-public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
